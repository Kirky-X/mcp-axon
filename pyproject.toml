[project]
name = "mcp-axon"
version = "0.1.0"
description = "MCP-based requirement chain management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27.0,<2.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "networkx>=3.6.1,<4.0.0",
    "tenacity>=9.1.4,<10.0.0",
    "python-json-logger>=4.1.0,<5.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "real-ladybug>=0.15.3",
    "transitions>=0.9.3",
    "dependency-injector>=4.49.0",
    "cachetools>=7.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-benchmark==4.0.0",
]

[project.scripts]
mcp-axon = "src.api.mcp_server:entry_point"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cache-clear"
asyncio_mode = "auto"
cache_dir = "/tmp/pytest_cache"
# 禁止生成 __pycache__
env = ["PYTHONDONTWRITEBYTECODE=1"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260408",
]

[tool.mypy]
python_version = "3.12"
# 将缓存重定向到 /tmp
cache_dir = "/tmp/mypy_cache"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "networkx.*",
    "transitions.*",
    "dependency_injector.*",
    "real_ladybug.*",
]
ignore_missing_imports = true
follow_imports = "skip"
