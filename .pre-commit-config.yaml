# Pre-commit hooks for MCP-Axon Python Project
# Install: pip install pre-commit && pre-commit install
# Docs: https://pre-commit.com/

repos:
  # 1. Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # 2. Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--exclude-files, tests/]
        exclude: '^uv\.lock$'

  # 3. Python formatting and checks
  - repo: local
    hooks:
      - id: ruff-format
        name: Format Python code
        description: Run ruff format on Python files
        entry: uv run ruff format --cache-dir=/tmp/ruff_cache
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --cache-dir=/tmp/ruff_cache --exit-zero
        language: system
        types: [python]
        pass_filenames: false
        args: ['--fix']

      - id: mypy
        name: mypy type check
        entry: uv run mypy --cache-dir=/tmp/mypy_cache
        language: system
        types: [python]
        pass_filenames: false
        args: ['src/']

ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
