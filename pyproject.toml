[project]
name = "mcp-axon"
version = "0.1.0"
description = "MCP-based requirement chain management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==1.25.0",
    "pydantic>=2.11.0,<3.0.0",
    "networkx==3.2.1",
    "tenacity==8.2.3",
    "python-json-logger==2.0.7",
    "pyyaml==6.0.1",
    "real-ladybug>=0.15.3",
    "transitions>=0.9.3",
    "dependency-injector>=4.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-benchmark==4.0.0",
]

[project.scripts]
mcp-axon = "src.api.mcp_server:entry_point"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cache-clear"
asyncio_mode = "auto"
cache_dir = "/tmp/pytest_cache"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
