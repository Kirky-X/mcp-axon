# Alembic 配置文件

[alembic]
# 迁移脚本目录
script_location = alembic

# 用于迁移的模板文件
file_template = %%(year)d%%(month).02d%%(day).02d_%%(hour).02d%%(minute).02d_%%(rev)s_%%(slug)s

# 时区
timezone = UTC

# 迁移脚本前缀
prepend_sys_path = .

# 版本路径分隔符
version_path_separator = os

# 输出编码
output_encoding = utf-8

# 数据库 URL（从环境变量读取）
sqlalchemy.url = sqlite:///requirements.db

# 后续脚本配置
post_write_hooks = black
# post_write_hooks = isort

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S